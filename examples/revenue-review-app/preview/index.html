<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Revenue review preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega@5.30.0/build/vega.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.21.0/build/vega-lite.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.26.0/build/vega-embed.min.js"></script>
    <style>
      :root {
        --canvas: #f6f7f9;
        --surface: #ffffff;
        --ink: #1d2127;
        --ink-2: #4d5562;
        --ink-3: #7c8594;
        --line: #e3e6eb;
        --line-strong: #cfd4dc;
        --accent: #2266d3;
        --accent-soft: #e8f0fc;
        --positive: #1a7f4b;
        --critical: #c93a3a;
        --bar: #18202b;
        --bar-ink: #e9edf3;
        --bar-ink-2: #9aa5b5;
        --radius: 8px;
        --sans: 'Inter', system-ui, -apple-system, sans-serif;
        --mono: 'JetBrains Mono', ui-monospace, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --canvas: #111418;
          --surface: #181c22;
          --ink: #e7eaef;
          --ink-2: #b3bac6;
          --ink-3: #828b99;
          --line: #2a3039;
          --line-strong: #3a414c;
          --accent: #5b93ef;
          --accent-soft: #1d2a40;
          --positive: #4cc38a;
          --critical: #f07070;
          --bar: #0a0c0f;
        }
      }
      :root[data-theme='dark'] {
        --canvas: #111418; --surface: #181c22; --ink: #e7eaef; --ink-2: #b3bac6; --ink-3: #828b99;
        --line: #2a3039; --line-strong: #3a414c; --accent: #5b93ef; --accent-soft: #1d2a40;
        --positive: #4cc38a; --critical: #f07070; --bar: #0a0c0f;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--canvas); color: var(--ink); font: 14px/1.55 var(--sans); }

      /* Preview bar: the only part of this page that is not the app itself. */
      .bar { position: sticky; top: 0; z-index: 10; background: var(--bar); color: var(--bar-ink); }
      .bar-inner { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 14px; }
      .bar .where { font-size: 12.5px; color: var(--bar-ink-2); }
      .bar .where strong { color: var(--bar-ink); font-weight: 600; }
      .bar .status { margin-left: auto; font-size: 12.5px; color: var(--bar-ink-2); display: flex; align-items: center; gap: 8px; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: #5d6878; }
      .dot.ok { background: #4cc38a; } .dot.warn { background: #e2a336; } .dot.busy { background: #5b93ef; animation: pulse 1.2s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .35; } }
      @media (prefers-reduced-motion: reduce) { .dot.busy { animation: none; } }
      button.run { font: 600 13px var(--sans); color: #fff; background: var(--accent); border: 0; border-radius: 6px; padding: 7px 16px; cursor: pointer; }
      button.run:disabled { opacity: .55; cursor: progress; }
      button:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* App canvas: mirrors Deepnote's full-width app layout (rows of a 12-column grid). */
      main { max-width: 1240px; margin: 0 auto; padding: 28px 16px 80px; }
      .row { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
      .col { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
      @media (max-width: 768px) { .row { grid-template-columns: 1fr; } .col { grid-column: auto !important; } }
      .block { min-width: 0; }
      .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }

      h1.app-title { font-size: 30px; line-height: 1.2; letter-spacing: -0.02em; font-weight: 700; margin: 4px 0 0; }
      h2.section { font-size: 20px; letter-spacing: -0.01em; font-weight: 650; margin: 24px 0 0; padding-top: 20px; border-top: 1px solid var(--line); }
      .md { color: var(--ink-2); max-width: 78ch; }
      .md p { margin: 0 0 8px; } .md p:last-child { margin-bottom: 0; }
      .md strong { color: var(--ink); }

      label.input { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
      select, textarea { font: 14px var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 6px; padding: 8px 10px; width: 100%; }
      textarea { min-height: 76px; resize: vertical; line-height: 1.5; }

      .kpi .title { font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
      .kpi .value { font-size: 30px; font-weight: 650; letter-spacing: -0.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
      .kpi .cmp { font-size: 12.5px; margin-top: 2px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
      .kpi .cmp b { font-weight: 600; }
      .up { color: var(--positive); } .down { color: var(--critical); }

      .chart-title { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
      .chart { width: 100%; }

      table.df { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
      table.df th { text-align: left; font-weight: 600; color: var(--ink-2); border-bottom: 1px solid var(--line-strong); padding: 6px 10px 6px 0; white-space: nowrap; }
      table.df td { border-bottom: 1px solid var(--line); padding: 7px 10px 7px 0; white-space: nowrap; }
      table.df .num { text-align: right; }
      table.df tr:last-child td { border-bottom: 0; }
      .scroll { overflow-x: auto; }

      .agent { border-color: var(--line-strong); }
      .agent-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .agent-head .name { font-weight: 650; }
      .agent-head .model { font: 12px var(--mono); color: var(--ink-3); }
      .agent details { margin-top: 8px; font-size: 12.5px; color: var(--ink-3); }
      .agent details pre { white-space: pre-wrap; font: 12px/1.5 var(--mono); color: var(--ink-2); background: var(--canvas); border-radius: 6px; padding: 10px 12px; }
      .agent-body { margin-top: 14px; display: flex; flex-direction: column; gap: 14px; }
      .agent-step { border-left: 2px solid var(--accent-soft); padding-left: 14px; }
      .agent-step details.code summary { cursor: pointer; font-size: 12px; color: var(--ink-3); }
      .agent-step details.code pre { white-space: pre; overflow-x: auto; font: 12px/1.5 var(--mono); background: var(--canvas); border-radius: 6px; padding: 10px 12px; }
      .answer { background: var(--accent-soft); border-radius: var(--radius); padding: 14px 16px; }
      .answer .md, .agent-step .md { color: var(--ink); }
      .answer ul, .agent-step ul { margin: 6px 0; padding-left: 20px; }
      img.out { max-width: 100%; border-radius: 6px; }
      iframe.out { width: 100%; border: 0; background: #fff; border-radius: 6px; }
      pre.text { white-space: pre-wrap; font: 12.5px/1.5 var(--mono); margin: 0; color: var(--ink-2); }
      .error { color: var(--critical); font-size: 13px; }
      .error code { font: 12.5px var(--mono); }
      .empty { color: var(--ink-3); font-size: 13px; }
      .stale { opacity: .45; transition: opacity .2s; }
      @media (prefers-reduced-motion: reduce) { .stale { transition: none; } }
    </style>
  </head>
  <body>
    <div class="bar">
      <div class="bar-inner">
        <div class="where">Local preview of the Deepnote app <strong id="app-name">…</strong></div>
        <div class="status"><span class="dot" id="dot"></span><span id="status">Loading</span></div>
        <button class="run" id="run" type="button" disabled>Run</button>
      </div>
    </div>
    <main id="app" aria-live="polite"></main>

    <script>
      const $ = s => document.querySelector(s)
      const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n }
      const joinText = v => (Array.isArray(v) ? v.join('') : v ?? '')
      const state = { config: null, source: null, snapshot: null, values: {}, running: false, startedAt: 0 }

      function setStatus(text, kind) { $('#status').textContent = text; $('#dot').className = 'dot ' + (kind || '') }

      // ---------- layout: the same rules as Deepnote's app layout editor ----------
      function layoutRows(blocks) {
        const visible = blocks.filter(b => b.metadata?.deepnote_app_block_visible)
        visible.sort((a, b) => (a.metadata.deepnote_app_block_order ?? 0) - (b.metadata.deepnote_app_block_order ?? 0))
        const rows = []
        for (const block of visible) {
          const group = block.metadata.deepnote_app_block_group_id
          const last = rows[rows.length - 1]
          if (group && last && last.group === group) last.blocks.push(block)
          else rows.push({ group, blocks: [block] })
        }
        return rows.map(row => {
          const cols = []
          for (const b of row.blocks) {
            const sub = b.metadata.deepnote_app_block_subgroup_id
            const existing = sub && cols.find(c => c.sub === sub)
            if (existing) existing.blocks.push(b)
            else cols.push({ sub, width: b.metadata.deepnote_app_block_width || 1, blocks: [b] })
          }
          return toTwelfths(cols)
        })
      }
      function toTwelfths(cols) {
        const total = cols.reduce((s, c) => s + c.width, 0)
        let spans = cols.map(c => Math.max(1, Math.round((c.width / total) * 12)))
        let diff = 12 - spans.reduce((a, b) => a + b, 0)
        for (let i = 0; diff !== 0; i = (i + 1) % spans.length) { const step = Math.sign(diff); if (spans[i] + step >= 1) { spans[i] += step; diff -= step } }
        return cols.map((c, i) => ({ ...c, span: spans[i] }))
      }

      // ---------- outputs ----------
      function outputsOf(id) {
        const block = state.snapshot?.blocks.find(b => b.id === id)
        return block?.outputs ?? []
      }
      function renderOutputs(outputs, host) {
        for (const o of outputs) {
          const node = renderOutput(o)
          if (node) host.append(node)
        }
      }
      function renderOutput(o) {
        if (o.output_type === 'error') {
          const box = el('div', 'error'); box.append(el('code', null, `${o.ename}: ${o.evalue}`)); return box
        }
        if (o.output_type === 'stream') return el('pre', 'text', joinText(o.text))
        const d = o.data || {}
        if (d['application/vnd.deepnote.dataframe.v3+json']) return renderTable(d['application/vnd.deepnote.dataframe.v3+json'])
        if (d['application/vnd.vega.v5+json']) return renderVega(d['application/vnd.vega.v5+json'], 'vega')
        for (const k of Object.keys(d)) if (/^application\/vnd\.vegalite\.v\d\+json$/.test(k)) return renderVega(d[k], 'vega-lite')
        if (d['image/png']) { const img = el('img', 'out'); img.alt = 'Chart'; img.src = 'data:image/png;base64,' + joinText(d['image/png']).replace(/\s+/g, ''); return img }
        if (d['text/markdown']) return markdown(joinText(d['text/markdown']))
        if (d['text/html']) return sandbox(joinText(d['text/html']))
        if (d['text/plain']) return el('pre', 'text', joinText(d['text/plain']))
        return null
      }
      function renderTable(df) {
        const cols = df.columns.map(c => c.name).filter(n => n !== '_deepnote_index_column')
        const numeric = new Set(df.columns.filter(c => /int|float/.test(c.dtype)).map(c => c.name))
        const wrap = el('div', 'scroll'); const t = el('table', 'df'); const hr = el('tr')
        for (const c of cols) { const th = el('th', numeric.has(c) ? 'num' : '', c); hr.append(th) }
        const thead = el('thead'); thead.append(hr); t.append(thead)
        const tb = el('tbody')
        for (const r of df.rows) {
          const tr = el('tr')
          for (const c of cols) {
            const v = r[c]; const isNum = typeof v === 'number'
            const td = el('td', isNum ? 'num' : '', isNum ? v.toLocaleString('en-US', { maximumFractionDigits: 2 }) : String(v ?? ''))
            if (isNum && /change/i.test(c)) td.classList.add(v < 0 ? 'down' : v > 0 ? 'up' : '')
            tr.append(td)
          }
          tb.append(tr)
        }
        t.append(tb); wrap.append(t); return wrap
      }
      // Deepnote's chart compiler emits axis/tooltip formats that call a function its frontend registers.
      vega.expressionFunction('numberFormatFromNumberType', (value, format) => {
        if (typeof value !== 'number') return String(value)
        const decimals = format?.decimals
        if (format?.type === 'percent') return (value * 100).toFixed(decimals ?? 0) + '%'
        return value.toLocaleString('en-US', decimals == null ? { maximumFractionDigits: 2 } : { minimumFractionDigits: decimals, maximumFractionDigits: decimals })
      })
      // Deepnote's categorical palette (the scheme its chart blocks reference by name).
      vega.scheme('deepnote10', ['#2266D3', '#CC8BFF', '#0E9384', '#8DCA4C', '#F9732C', '#C8338A', '#EEC026', '#61646C', '#4E2B89', '#6E7BA4'])
      vega.scheme('deepnote_blues', ['#D1E0FF', '#2266D3', '#07419D'])
      function renderVega(spec, mode) {
        const host = el('div', 'chart')
        const s = structuredClone(spec)
        requestAnimationFrame(() => {
          const css = getComputedStyle(document.documentElement)
          const bg = css.getPropertyValue('--surface').trim(), fg = css.getPropertyValue('--ink').trim()
          if (mode === 'vega') {
            // The same runtime theming Deepnote's VegaContainer applies (addRuntimeDataToVegaSpec).
            s.background = bg; s.padding = 16; s.autosize = { type: 'fit', contains: 'padding' }
            s.width = host.clientWidth; s.height = 300
            const font = 'Inter, system-ui, sans-serif'
            s.config = { ...(s.config || {}),
              style: { cell: { stroke: bg }, circle: { size: 48 } },
              legend: { ...(s.config?.legend || {}), labelFont: font, labelFontSize: 12, labelColor: fg, titleColor: fg, titleFont: font, titleFontWeight: 'normal', symbolType: 'circle', symbolSize: 48, padding: 4, rowPadding: 8, titlePadding: 12 },
              title: { anchor: 'start', color: fg, font, fontWeight: 600, fontSize: 14, offset: 16, orient: 'top' },
              axis: { domainCap: 'round', gridCap: 'round', gridColor: '#abbbca', gridWidth: 0.5, labelColor: fg, labelFont: font, labelFontSize: 12, labelOverlap: 'parity', titleColor: fg, titleFont: font, titleFontSize: 12, titleFontWeight: 500, titlePadding: 14 },
              axisX: { labelPadding: 6 }, axisY: { labelPadding: 12 },
              line: { strokeCap: 'butt', strokeWidth: 2, strokeJoin: 'bevel' },
            }
          } else { s.width = 'container'; s.background = bg }
          vegaEmbed(host, s, { mode, actions: false, renderer: 'svg' }).catch(e => host.append(el('div', 'error', 'Chart failed: ' + e.message)))
        })
        return host
      }
      function markdown(text) { const d = el('div', 'md'); d.innerHTML = marked.parse(text); return d }
      function sandbox(html) {
        const f = el('iframe', 'out'); f.setAttribute('sandbox', 'allow-scripts'); f.srcdoc = html
        f.onload = () => { try { f.style.height = (f.contentDocument?.body?.scrollHeight || 320) + 20 + 'px' } catch { f.style.height = '360px' } }
        f.style.height = '360px'; return f
      }

      // ---------- big number, with Deepnote's own formatting rules ----------
      function formatValue(value, format = 'number') {
        if (format === 'plain') return String(value)
        if (format === 'percent') { const p = value * 100; return Math.round(p) === p ? `${p}%` : `${p.toFixed(2)}%` }
        if (format === 'currency') return value.toLocaleString('en-US', { style: 'currency', currency: 'USD' })
        if (format === 'scientific') return value.toExponential(2).toUpperCase()
        return value.toLocaleString()
      }
      function renderBigNumber(block) {
        const m = block.metadata; const card = el('div', 'card kpi')
        card.append(el('div', 'title', m.deepnote_big_number_title))
        const out = outputsOf(block.id)[0]
        let payload = null
        try { payload = JSON.parse(joinText(out?.data?.['text/plain']).trim().replace(/^'|'$/g, '')) } catch {}
        if (!payload) { card.append(el('div', 'value', '–')); return card }
        const fmt = m.deepnote_big_number_format || 'number'
        const value = parseFloat(payload.value)
        card.append(el('div', 'value', isNaN(value) ? payload.value : formatValue(value, fmt)))
        if (m.deepnote_big_number_comparison_enabled && payload.comparisonValue) {
          const c = parseFloat(payload.comparisonValue); const type = m.deepnote_big_number_comparison_type || 'absolute-change'
          let delta = type === 'percentage-change' ? (value - c) / c : type === 'absolute-value' ? c : value - c
          const text = type === 'percentage-change' ? formatValue(Math.round(delta * 100) / 100, 'percent') : formatValue(Math.round(delta * 1e4) / 1e4, fmt)
          const cmp = el('div', 'cmp'); const b = el('b', delta >= 0 ? 'up' : 'down', (delta >= 0 && type !== 'absolute-value' ? '+' : '') + text)
          cmp.append(b, ' ' + (payload.comparisonTitle || '')); card.append(cmp)
        }
        return card
      }

      // ---------- blocks ----------
      function renderBlock(block) {
        const m = block.metadata || {}
        switch (block.type) {
          case 'text-cell-h1': return el('h1', 'app-title', block.content)
          case 'text-cell-h2': return el('h2', 'section', block.content)
          case 'markdown': return markdown(block.content)
          case 'input-select': {
            const lab = el('label', 'input', m.deepnote_input_label); const sel = el('select')
            for (const o of m.deepnote_variable_options) { const opt = el('option', null, o); opt.value = o; sel.append(opt) }
            sel.value = state.values[m.deepnote_variable_name] ?? m.deepnote_variable_value
            sel.onchange = () => { state.values[m.deepnote_variable_name] = sel.value; markStale() }
            lab.append(sel); return lab
          }
          case 'input-textarea': {
            const lab = el('label', 'input', m.deepnote_input_label); const ta = el('textarea')
            ta.value = state.values[m.deepnote_variable_name] ?? m.deepnote_variable_value ?? ''
            ta.oninput = () => { state.values[m.deepnote_variable_name] = ta.value }
            ta.onkeydown = e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) run() }
            lab.append(ta); return lab
          }
          case 'big-number': return renderBigNumber(block)
          case 'visualization': {
            const card = el('div', 'card')
            const outs = outputsOf(block.id); outs.length ? renderOutputs(outs, card) : card.append(el('div', 'empty', 'Run the app to draw this chart.'))
            return card
          }
          case 'code': {
            const card = el('div', 'card'); const title = (block.content.match(/^#\s*(.+)/) || [])[1]
            if (title) card.append(el('div', 'chart-title', title))
            const outs = outputsOf(block.id); outs.length ? renderOutputs(outs, card) : card.append(el('div', 'empty', 'Run the app to see this table.'))
            return card
          }
          case 'agent': return renderAgent(block)
          default: return el('div', 'empty', `(${block.type} block)`)
        }
      }

      function renderAgent(block) {
        const card = el('div', 'card agent'); const head = el('div', 'agent-head')
        head.append(el('span', 'name', 'Analyst'), el('span', 'model', state.config.agent.model))
        card.append(head)
        const prompt = el('details'); prompt.append(el('summary', null, 'How the analyst is instructed'), el('pre', null, block.content)); card.append(prompt)
        const body = el('div', 'agent-body'); card.append(body)
        if (state.running) { body.append(el('div', 'empty', 'The analyst is working on your question. This can take a minute or two.')); return card }
        const snap = state.snapshot
        if (!snap) { body.append(el('div', 'empty', 'Run the app to get an answer.')); return card }
        // Blocks the agent added sit right after it in the run's notebook and are not in the source notebook.
        const sourceIds = new Set(state.source.blocks.map(b => b.id))
        const idx = snap.blocks.findIndex(b => b.id === block.id)
        const added = snap.blocks.slice(idx + 1).filter(b => !sourceIds.has(b.id))
        for (const b of added) {
          const step = el('div', 'agent-step')
          if (b.type === 'markdown') { step.append(markdown(b.content)) } else {
            const code = el('details', 'code'); code.append(el('summary', null, 'Code the analyst ran'), el('pre', null, b.content)); step.append(code)
            renderOutputs(b.outputs || [], step)
          }
          body.append(step)
        }
        const own = outputsOf(block.id)
        const err = own.find(o => o.output_type === 'error')
        if (err) { const e = el('div', 'error'); e.append(el('code', null, err.evalue)); if (!state.config.agent.keySet) e.append(el('div', null, `Add ${state.config.agent.keyVar} to examples/revenue-review-app/preview/.env and restart the preview.`)); body.append(e) }
        const final = joinText(own.find(o => o.output_type === 'stream')?.text).trim()
        if (final) { const a = el('div', 'answer'); a.append(markdown(final)); body.append(a) }
        if (!added.length && !final && !err) body.append(el('div', 'empty', 'No answer yet. Press Run.'))
        return card
      }

      function render() {
        const main = $('#app'); main.replaceChildren()
        for (const row of layoutRows(state.source.blocks)) {
          const r = el('div', 'row')
          for (const col of row) {
            const c = el('div', 'col'); c.style.gridColumn = `span ${col.span}`
            for (const b of col.blocks) { const wrap = el('div', 'block'); wrap.dataset.type = b.type; wrap.append(renderBlock(b)); c.append(wrap) }
            r.append(c)
          }
          main.append(r)
        }
      }
      function markStale() { document.querySelectorAll('.block[data-type="big-number"], .block[data-type="visualization"], .block[data-type="code"]').forEach(n => n.classList.add('stale')); setStatus('Inputs changed. Press Run to update.', 'warn') }

      function adoptSnapshot(yamlText) {
        const doc = jsyaml.load(yamlText); const nb = doc.project.notebooks[0]
        state.snapshot = nb
        for (const b of nb.blocks) if (b.type.startsWith('input-') && b.metadata?.deepnote_variable_name) state.values[b.metadata.deepnote_variable_name] = b.metadata.deepnote_variable_value
        return doc
      }

      async function run() {
        if (state.running) return
        state.running = true; state.startedAt = Date.now(); $('#run').disabled = true
        const tick = setInterval(() => setStatus(`Running in the local kernel · ${Math.round((Date.now() - state.startedAt) / 1000)}s`, 'busy'), 500)
        render(); markStale()
        try {
          const res = await fetch('/api/run', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ inputs: state.values }) })
          const data = await res.json()
          if (!res.ok) throw new Error(data.error || res.statusText)
          if (data.snapshotYaml) adoptSnapshot(data.snapshotYaml)
          const secs = Math.round((Date.now() - state.startedAt) / 1000)
          setStatus(data.success ? `Ran in ${secs}s` : `Ran in ${secs}s with a failed block`, data.success ? 'ok' : 'warn')
        } catch (e) {
          setStatus('Run failed: ' + e.message, 'warn')
        } finally {
          clearInterval(tick); state.running = false; $('#run').disabled = false; render()
        }
      }

      async function boot() {
        state.config = await (await fetch('build/preview.json', { cache: 'no-store' })).json()
        $('#app-name').textContent = state.config.projectName
        document.title = state.config.projectName + ' preview'
        state.source = jsyaml.load(await (await fetch(state.config.notebookFile, { cache: 'no-store' })).text()).project.notebooks[0]
        for (const b of state.source.blocks) if (b.type.startsWith('input-')) state.values[b.metadata.deepnote_variable_name] = b.metadata.deepnote_variable_value
        if (state.config.latestSnapshot) {
          const res = await fetch(state.config.latestSnapshot, { cache: 'no-store' })
          if (res.ok) adoptSnapshot(await res.text())
        }
        render()
        setStatus(state.snapshot ? 'Showing the last run' : 'Press Run to compute the app', state.snapshot ? 'ok' : '')
        $('#run').disabled = false; $('#run').onclick = run
      }
      boot().catch(e => setStatus('Preview failed to load: ' + e.message, 'warn'))
    </script>
  </body>
</html>
