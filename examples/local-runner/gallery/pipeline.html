<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pipeline replay — Deepnote snapshot gallery</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f7f5;
        --surface: #fff;
        --surface-2: #f2f2ef;
        --ink: #191918;
        --ink-2: #595852;
        --ink-3: #89877f;
        --line: #dfded8;
        --line-2: #ecebe7;
        --accent: #5a43e6;
        --accent-soft: #efedff;
        --pos: #16826f;
        --pos-soft: #e8f6f1;
        --warning: #ae6510;
        --shadow: 0 1px 2px rgb(20 20 18 / 4%), 0 14px 38px -22px rgb(20 20 18 / 30%);
        --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #11110f;
          --surface: #1b1b18;
          --surface-2: #24241f;
          --ink: #f2f1ec;
          --ink-2: #b1afa6;
          --ink-3: #7f7d74;
          --line: #36352f;
          --line-2: #2a2924;
          --accent: #a99bff;
          --accent-soft: #292347;
          --pos: #54cbb1;
          --pos-soft: #19342e;
          --warning: #f1a753;
          --shadow: 0 1px 2px rgb(0 0 0 / 40%), 0 16px 40px -22px rgb(0 0 0 / 90%);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        font-variant-numeric: tabular-nums;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
      }
      .wrap {
        max-width: 1540px;
        margin: 0 auto;
        padding: 30px clamp(16px, 3vw, 42px) 80px;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 34px;
      }
      .back {
        color: var(--ink-3);
        font-size: 0.8rem;
        text-decoration: none;
      }
      .back:hover {
        color: var(--accent);
      }
      .static {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--pos);
        font: 600 0.72rem var(--mono);
      }
      .static::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--pos);
        content: "";
      }
      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        gap: 24px;
      }
      .eyebrow {
        margin: 0 0 8px;
        color: var(--accent);
        font: 650 0.72rem var(--mono);
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.7rem, 3vw, 2.55rem);
        font-weight: 680;
        letter-spacing: -0.035em;
      }
      .lede {
        max-width: 70ch;
        margin: 10px 0 0;
        color: var(--ink-2);
        font-size: 0.95rem;
        line-height: 1.6;
      }
      .facts {
        display: flex;
        gap: 20px;
        margin: 0;
      }
      .fact {
        min-width: 76px;
      }
      .fact dt {
        color: var(--ink-3);
        font: 0.66rem var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .fact dd {
        margin: 5px 0 0;
        font-size: 0.92rem;
        font-weight: 640;
      }
      .pipeline-shell {
        margin-top: 26px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .pipeline-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 13px 18px;
        border-bottom: 1px solid var(--line-2);
        color: var(--ink-3);
        font: 0.7rem var(--mono);
      }
      .legend {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .legend i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--pos);
      }
      .legend i.local {
        background: var(--ink-3);
      }
      .graph-scroll {
        overflow-x: auto;
        overscroll-behavior-inline: contain;
      }
      #graph {
        display: block;
        min-width: 1180px;
        width: 100%;
        height: auto;
      }
      .stage-label {
        fill: var(--ink-3);
        font: 600 9px var(--mono);
        letter-spacing: 0.09em;
      }
      .edge {
        fill: none;
        stroke: var(--line);
        stroke-width: 2;
      }
      .edge.recovery {
        stroke: var(--warning);
      }
      .edge-label {
        fill: var(--ink-3);
        font: 9px var(--mono);
      }
      .node {
        cursor: default;
      }
      .node.notebook {
        cursor: pointer;
      }
      .node rect {
        fill: var(--surface);
        stroke: var(--line);
        stroke-width: 1.5;
        transition:
          fill 0.15s,
          stroke 0.15s;
      }
      .node.notebook:hover rect,
      .node.notebook:focus-visible rect {
        stroke: var(--accent);
      }
      .node.notebook:focus {
        outline: none;
      }
      .node.selected rect {
        fill: var(--accent-soft);
        stroke: var(--accent);
        stroke-width: 2.5;
      }
      .node.local rect {
        fill: var(--surface-2);
        stroke-dasharray: 4 3;
      }
      .node .status {
        fill: var(--pos);
      }
      .node.local .status {
        fill: var(--ink-3);
      }
      .node .label {
        fill: var(--ink);
        font: 650 12px var(--sans);
      }
      .node .detail {
        fill: var(--ink-3);
        font: 9px var(--mono);
      }
      .node .duration {
        fill: var(--ink-2);
        font: 600 9px var(--mono);
      }
      .cloud-link circle {
        fill: var(--surface-2);
        stroke: var(--line);
      }
      .cloud-link text {
        fill: var(--accent);
        font: 700 11px var(--sans);
      }
      .cloud-link:hover circle,
      .cloud-link:focus-visible circle {
        stroke: var(--accent);
      }
      .cloud-link:focus {
        outline: none;
      }
      .detail-card {
        margin-top: 20px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .detail-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
        padding: 22px 24px;
        border-bottom: 1px solid var(--line-2);
      }
      .step-kicker {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 7px;
        color: var(--pos);
        font: 650 0.68rem var(--mono);
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }
      .step-kicker::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--pos);
        content: "";
      }
      .detail-head h2 {
        margin: 0;
        font-size: 1.25rem;
        letter-spacing: -0.02em;
      }
      .step-meta {
        margin-top: 6px;
        color: var(--ink-3);
        font: 0.72rem var(--mono);
      }
      .open-run {
        flex: none;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 650;
        text-decoration: none;
      }
      .open-run:hover {
        border-color: var(--accent);
      }
      .snapshot-body {
        min-height: 210px;
        padding: 24px;
      }
      .loading,
      .error {
        display: grid;
        min-height: 180px;
        place-items: center;
        color: var(--ink-3);
        font: 0.8rem var(--mono);
      }
      .error {
        color: #c64c62;
      }
      .inputs {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-bottom: 18px;
      }
      .chip {
        display: inline-flex;
        align-items: baseline;
        gap: 7px;
        padding: 5px 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface-2);
        font-size: 0.72rem;
      }
      .chip b {
        color: var(--ink-3);
        font: 0.68rem var(--mono);
      }
      .decision {
        margin: 0;
        padding: 20px 22px;
        border-left: 3px solid var(--accent);
        border-radius: 0 10px 10px 0;
        background: var(--accent-soft);
        color: var(--ink);
        font: 0.94rem/1.7 var(--sans);
        white-space: pre-wrap;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
        gap: 10px;
      }
      .metric {
        padding: 13px 14px;
        border: 1px solid var(--line-2);
        border-radius: 9px;
        background: var(--surface-2);
      }
      .metric .name {
        color: var(--ink-3);
        font: 0.66rem var(--mono);
      }
      .metric .value {
        margin-top: 5px;
        font-size: 1rem;
        font-weight: 650;
      }
      details.raw {
        margin-top: 16px;
      }
      details.raw summary {
        cursor: pointer;
        color: var(--ink-3);
        font: 0.7rem var(--mono);
      }
      details.raw pre {
        margin: 10px 0 0;
        overflow-x: auto;
        padding: 13px;
        border: 1px solid var(--line-2);
        border-radius: 8px;
        background: var(--surface-2);
        color: var(--ink-2);
        font: 0.75rem/1.6 var(--mono);
        white-space: pre-wrap;
      }
      @media (max-width: 820px) {
        .hero {
          grid-template-columns: 1fr;
        }
        .facts {
          flex-wrap: wrap;
        }
        .pipeline-head,
        .detail-head {
          align-items: flex-start;
          flex-direction: column;
        }
        .legend {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="top">
        <a class="back" href="./">← Snapshot gallery</a>
        <span class="static">Static artifacts · no kernel</span>
      </div>

      <section class="hero" aria-labelledby="title">
        <div>
          <p class="eyebrow">Pipeline replay</p>
          <h1 id="title">Loading pipeline…</h1>
          <p class="lede" id="subtitle"></p>
        </div>
        <dl class="facts" id="facts"></dl>
      </section>

      <section class="pipeline-shell" aria-label="Pipeline execution graph">
        <div class="pipeline-head">
          <span>LEFT → RIGHT · FAN-OUT, CONDITION, MODEL FAN-OUT, ARBITRATION</span>
          <span class="legend">
            <span><i></i>Notebook run</span>
            <span><i class="local"></i>Local orchestration</span>
            <span>Click to inspect · ↗ opens Deepnote</span>
          </span>
        </div>
        <div class="graph-scroll">
          <svg id="graph" viewBox="0 0 1450 450" role="img" aria-labelledby="graph-title">
            <title id="graph-title">A left-to-right graph of the completed notebook pipeline</title>
          </svg>
        </div>
      </section>

      <article class="detail-card" aria-live="polite">
        <header class="detail-head" id="detail-head"></header>
        <div class="snapshot-body" id="snapshot-body">
          <div class="loading">Loading concluding snapshot…</div>
        </div>
      </article>
    </main>

    <script src="./snapshot-reader.js"></script>
    <script type="module">
      import { firstNotebook, fmtValue, inputs, streamText } from './gallery.js'
      import { normalizePipelineManifest } from './pipeline-data.js'

      const svgNs = 'http://www.w3.org/2000/svg'
      const nodeWidth = 164
      const nodeHeight = 68
      const xGap = 37
      const xOrigin = 22
      const yOrigin = 62
      const yGap = 122
      const cache = new Map()
      let manifest
      let selectionGeneration = 0

      try {
        const response = await fetch('./pipeline.json')
        if (!response.ok) throw new Error(`HTTP ${response.status}`)
        manifest = normalizePipelineManifest(await response.json())
        renderHeader()
        renderGraph()
        const hashStep = decodeHashStep(location.hash)
        const initial = manifest.nodes.some(node => node.id === hashStep && hasSnapshot(node))
          ? hashStep
          : manifest.concludingStepId
        await selectStep(initial, false)
      } catch (error) {
        document.querySelector('#title').textContent = 'Pipeline unavailable'
        showError(
          `Could not load the static pipeline artifacts: ${error.message}. Run "pnpm example:gallery" or deploy this directory to a static host.`
        )
      }

      window.addEventListener('hashchange', () => {
        const step = decodeHashStep(location.hash)
        if (manifest?.nodes.some(node => node.id === step && hasSnapshot(node))) selectStep(step, false)
      })

      function decodeHashStep(hash) {
        try {
          return decodeURIComponent(hash.slice(1))
        } catch {
          return ''
        }
      }

      function renderHeader() {
        document.querySelector('#title').textContent = manifest.title
        document.querySelector('#subtitle').textContent = manifest.subtitle
        const facts = [
          ['Result', manifest.summary.finalDecision],
          ['Notebook runs', manifest.summary.notebookRuns],
          ['Wall time', duration(manifest.durationMs)],
          ['Captured', shortDate(manifest.capturedAt)],
        ]
        const root = document.querySelector('#facts')
        for (const [name, value] of facts) {
          const wrap = element('div', 'fact')
          const term = element('dt')
          term.textContent = name
          const detail = element('dd')
          detail.textContent = value
          wrap.append(term, detail)
          root.append(wrap)
        }
      }

      function renderGraph() {
        const graph = document.querySelector('#graph')
        const maxColumn = Math.max(0, ...manifest.nodes.map(node => node.column))
        const maxLane = Math.max(0, ...manifest.nodes.map(node => node.lane))
        const graphWidth = x(maxColumn) + nodeWidth + xOrigin
        graph.setAttribute('viewBox', `0 0 ${graphWidth} ${y(maxLane) + nodeHeight + 45}`)
        graph.style.minWidth = `${graphWidth}px`
        const defs = svg('defs')
        const marker = svg('marker', {
          id: 'arrow',
          markerWidth: '8',
          markerHeight: '8',
          refX: '7',
          refY: '4',
          orient: 'auto',
        })
        marker.append(svg('path', { d: 'M0,0 L8,4 L0,8 Z', fill: 'var(--line)' }))
        defs.append(marker)
        graph.append(defs)

        const stages = manifest.stageLabels ?? [
          'INPUTS',
          'REGIONAL FAN-OUT',
          'QUALITY',
          'RECOVERY',
          'PORTFOLIO',
          'MODEL PROVIDERS',
          'ARBITER',
        ]
        stages.forEach((stage, column) => {
          const label = svg('text', {
            x: String(x(column) + nodeWidth / 2),
            y: '26',
            class: 'stage-label',
            'text-anchor': 'middle',
          })
          label.textContent = stage
          graph.append(label)
        })

        const byId = new Map(manifest.nodes.map(node => [node.id, node]))
        for (const edge of manifest.edges) {
          const from = byId.get(edge.from)
          const to = byId.get(edge.to)
          if (!from || !to) continue
          const startX = x(from.column) + nodeWidth
          const startY = y(from.lane) + nodeHeight / 2
          const endX = x(to.column)
          const endY = y(to.lane) + nodeHeight / 2
          const bend = Math.max(25, (endX - startX) * 0.45)
          const path = svg('path', {
            d: `M${startX} ${startY} C${startX + bend} ${startY},${endX - bend} ${endY},${endX} ${endY}`,
            class: `edge${edge.label === 'below 95%' ? ' recovery' : ''}`,
            'marker-end': 'url(#arrow)',
          })
          graph.append(path)
          if (edge.label) {
            const label = svg('text', {
              x: String((startX + endX) / 2),
              y: String((startY + endY) / 2 - 7),
              class: 'edge-label',
              'text-anchor': 'middle',
            })
            label.textContent = edge.label
            graph.append(label)
          }
        }

        for (const node of manifest.nodes) graph.append(renderNode(node))
      }

      function renderNode(node) {
        const group = svg('g', {
          class: `node ${node.kind}`,
          transform: `translate(${x(node.column)} ${y(node.lane)})`,
          'data-step-id': node.id,
        })
        group.append(
          svg('rect', { width: String(nodeWidth), height: String(nodeHeight), rx: '9' }),
          svg('circle', { class: 'status', cx: '13', cy: '14', r: '3.5' })
        )
        const label = svg('text', { class: 'label', x: '14', y: '34' })
        label.textContent = node.label
        const detail = svg('text', { class: 'detail', x: '14', y: '52' })
        detail.textContent = node.detail
        group.append(label, detail)

        if (hasSnapshot(node)) {
          group.setAttribute('role', 'button')
          group.setAttribute('tabindex', '0')
          group.setAttribute('aria-label', `Inspect ${node.label} snapshot`)
          group.addEventListener('click', () => selectStep(node.id))
          group.addEventListener('keydown', event => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault()
              selectStep(node.id)
            }
          })
          const timing = svg('text', {
            class: 'duration',
            x: String(nodeWidth - 14),
            y: '34',
            'text-anchor': 'end',
          })
          timing.textContent = duration(node.durationMs)
          group.append(timing)
        }

        if (node.viewUrl) {
          const link = svg('a', {
            class: 'cloud-link',
            href: node.viewUrl,
            target: '_blank',
            rel: 'noopener',
            'aria-label': `Open ${node.label} notebook run in Deepnote`,
          })
          link.addEventListener('click', event => event.stopPropagation())
          link.append(
            svg('circle', { cx: String(nodeWidth - 14), cy: '14', r: '9' }),
            textSvg('↗', nodeWidth - 14, 18, 'middle')
          )
          group.append(link)
        }
        return group
      }

      async function selectStep(id, updateHash = true) {
        const node = manifest.nodes.find(candidate => candidate.id === id && hasSnapshot(candidate))
        if (!node) return
        const generation = ++selectionGeneration
        for (const candidate of document.querySelectorAll('.node')) {
          candidate.classList.toggle('selected', candidate.dataset.stepId === id)
        }
        renderDetailHead(node)
        document.querySelector('#snapshot-body').replaceChildren(loading('Loading snapshot…'))
        if (updateHash) history.replaceState(null, '', `#${encodeURIComponent(id)}`)
        try {
          let view = cache.get(node.id)
          if (!view) {
            if (node.snapshotYaml) {
              view = DeepnoteSnapshot.parseSnapshot(node.snapshotYaml)
            } else {
              const response = await fetch(node.snapshot)
              if (!response.ok) throw new Error(`HTTP ${response.status}`)
              view = DeepnoteSnapshot.parseSnapshot(await response.text())
            }
            cache.set(node.id, view)
          }
          if (generation === selectionGeneration) renderSnapshot(view)
        } catch (error) {
          if (generation === selectionGeneration) showError(`Could not read this step's snapshot: ${error.message}`)
        }
      }

      function renderDetailHead(node) {
        const root = document.querySelector('#detail-head')
        root.replaceChildren()
        const copy = element('div')
        const kicker = element('div', 'step-kicker')
        kicker.textContent = node.id === manifest.concludingStepId ? 'Concluding notebook · selected by default' : 'Notebook step'
        const title = element('h2')
        title.textContent = node.label
        const meta = element('div', 'step-meta')
        meta.textContent = [node.detail, duration(node.durationMs), node.runId ? `run ${node.runId}` : null]
          .filter(Boolean)
          .join(' · ')
        copy.append(kicker, title, meta)
        root.append(copy)
        if (node.viewUrl) {
          const link = element('a', 'open-run')
          link.href = node.viewUrl
          link.target = '_blank'
          link.rel = 'noopener'
          link.textContent = 'Open notebook run ↗'
          root.append(link)
        }
      }

      function hasSnapshot(node) {
        return Boolean(node.snapshot || node.snapshotYaml)
      }

      function renderSnapshot(view) {
        const root = document.querySelector('#snapshot-body')
        root.replaceChildren()
        const runInputs = inputs(view)
        if (runInputs.length) {
          const chips = element('div', 'inputs')
          for (const input of runInputs) {
            const chip = element('span', 'chip')
            const name = element('b')
            name.textContent = input.name
            chip.append(name, document.createTextNode(compactInput(input.value)))
            chips.append(chip)
          }
          root.append(chips)
        }

        const conclusion = conclusionText(view)
        const raw = streamText(view)
        const structured = parseJson(raw)
        if (conclusion) {
          const decision = element('pre', 'decision')
          decision.textContent = conclusion
          root.append(decision)
        } else if (structured) {
          root.append(renderMetrics(structured))
        } else {
          const output = element('pre', 'decision')
          output.textContent = raw || 'This snapshot has no textual output.'
          root.append(output)
        }

        const details = element('details', 'raw')
        const summary = element('summary')
        summary.textContent = `${view.projectName || 'Snapshot'} · ${firstNotebook(view).blocks.length} blocks · immutable .deepnote artifact`
        if (raw) {
          const pre = element('pre')
          pre.textContent = raw
          details.append(summary, pre)
        } else {
          details.append(summary)
        }
        root.append(details)
      }

      function conclusionText(view) {
        const blocks = firstNotebook(view).blocks
        const agentIndex = blocks.findIndex(block => block.type === 'agent')
        if (agentIndex < 0) return ''
        const written = blocks
          .slice(agentIndex + 1)
          .find(block => ['markdown', 'text-cell-p'].includes(block.type) && block.content?.trim())
        return written?.content?.trim() ?? ''
      }

      function renderMetrics(value) {
        const metrics = element('div', 'metrics')
        const fields = [
          ['Revenue', money(value.revenueK)],
          ['Forecast', money(value.forecastK)],
          ['Target', money(value.targetK)],
          ['Growth', `${value.growthPct}%`],
          ['Quality', `${Math.round(value.qualityScore * 100)}%`],
          ['Backfilled', value.backfilled ? 'Yes' : 'No'],
        ]
        for (const [name, fieldValue] of fields) {
          const card = element('div', 'metric')
          const label = element('div', 'name')
          label.textContent = name
          const result = element('div', 'value')
          result.textContent = fieldValue
          card.append(label, result)
          metrics.append(card)
        }
        return metrics
      }

      function compactInput(value) {
        if (typeof value === 'string' && value.trim().startsWith('{')) {
          const parsed = parseJson(value)
          const regionCount = parsed?.portfolio?.regions?.length ?? parsed?.regions?.length
          return regionCount ? `structured context · ${regionCount} regions` : `structured context · ${value.length} chars`
        }
        return fmtValue(value)
      }

      function parseJson(value) {
        try {
          return JSON.parse(value)
        } catch {
          return null
        }
      }

      function x(column) {
        return xOrigin + column * (nodeWidth + xGap)
      }
      function y(lane) {
        return yOrigin + lane * yGap
      }
      function duration(ms) {
        if (!Number.isFinite(ms)) return '—'
        const seconds = ms / 1000
        if (seconds < 60) return `${seconds.toFixed(seconds >= 10 ? 0 : 1)}s`
        return `${Math.floor(seconds / 60)}m ${Math.round(seconds % 60)}s`
      }
      function shortDate(iso) {
        return new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' })
      }
      function money(value) {
        return Number.isFinite(value) ? `$${Number(value).toLocaleString()}k` : '—'
      }
      function loading(message) {
        const node = element('div', 'loading')
        node.textContent = message
        return node
      }
      function showError(message) {
        const root = document.querySelector('#snapshot-body')
        root.replaceChildren()
        const node = element('div', 'error')
        node.textContent = message
        root.append(node)
      }
      function element(tag, className) {
        const node = document.createElement(tag)
        if (className) node.className = className
        return node
      }
      function svg(tag, attributes = {}) {
        const node = document.createElementNS(svgNs, tag)
        for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, value)
        return node
      }
      function textSvg(value, xPosition, yPosition, anchor) {
        const node = svg('text', {
          x: String(xPosition),
          y: String(yPosition),
          'text-anchor': anchor,
        })
        node.textContent = value
        return node
      }
    </script>
  </body>
</html>
