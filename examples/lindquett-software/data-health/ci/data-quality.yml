# Run the data health checks on every pull request and fail the check when one fails. Copy this file
# to .github/workflows/ to use it. The Data health app shows the same checks to everyone else.
#
# This version runs the example from a checkout of the deepnote/deepnote repository, where
# local/run.mjs replaces the notebook's module blocks so it can run on the CI runner. In your own
# repository, run your notebook directly with `npx @deepnote/cli run`, or add `--cloud` to run it
# in Deepnote with the project's modules and integrations. See
# https://deepnote.com/docs/deepnote-cli-ci and https://deepnote.com/docs/playbook-data-quality-checks
name: Data quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install deepnote-toolkit
        run: python -m pip install "deepnote-toolkit[server]"

      - name: Build the Deepnote packages
        run: pnpm install --frozen-lockfile && pnpm --filter @deepnote/cli... build

      - name: Run the data quality checks
        run: |
          node examples/lindquett-software/local/run.mjs data-health \
            --python "$(command -v python)" \
            --startup-timeout 60 --block-timeout 300 \
            -o json > data-quality.json

      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: data-quality
          path: data-quality.json
