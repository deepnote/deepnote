<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deepnote snapshot</title>
    <style>
      body { margin: 0 auto; padding: 2rem 1rem; max-width: 52rem; font: 16px/1.5 system-ui, sans-serif; color: #111 }
      h1 { margin: 0; font-size: 1.5rem }
      .meta { margin: 0.25rem 0 2rem; color: #666; font-size: 0.85rem }
      .block { margin: 0 0 1.5rem }
      pre { margin: 0 0 0.5rem; padding: 0.75rem; overflow-x: auto; border-radius: 6px; font: 13px/1.5 ui-monospace, monospace; white-space: pre-wrap }
      .source { background: #f6f8fa; border: 1px solid #e6e8eb }
      .error { background: #fff5f5; color: #b00 }
      img { max-width: 100% }
      iframe { width: 100%; height: 18rem; border: 1px solid #e6e8eb }
      .input { display: inline-block; padding: 0.2rem 0.5rem; background: #eef4ff; border-radius: 4px; font: 13px ui-monospace, monospace }
      .md { white-space: pre-wrap }
      @media (prefers-color-scheme: dark) {
        body { background: #0d1117; color: #e6edf3 }
        .source { background: #161b22; border-color: #30363d }
        .input { background: #1c2b47 }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>

    <!-- The snapshot reader: YAML parser + Deepnote schemas in one file. No server, no Python. -->
    <script src="./snapshot-reader.js"></script>
    <script>
      const app = document.getElementById('app')
      const src = new URLSearchParams(location.search).get('snapshot') ?? './snapshot.deepnote'

      const el = (tag, cls, text) => {
        const node = document.createElement(tag)
        if (cls) node.className = cls
        if (text !== undefined) node.textContent = text
        return node
      }
      const text = v => (Array.isArray(v) ? v.join('') : typeof v === 'string' ? v : '')
      const stripAnsi = s => s.replace(/\x1b\[[0-9;]*m/g, '')

      // Notebook HTML (pandas tables, chart embeds) goes in a sandboxed iframe with scripts
      // disabled — never innerHTML. A snapshot you share must not run script in the reader's page.
      const sandbox = html => {
        const frame = document.createElement('iframe')
        frame.setAttribute('sandbox', '')
        frame.srcdoc = `<!doctype html><meta charset="utf-8"><style>body{margin:0;font:14px system-ui,sans-serif}table{border-collapse:collapse}th,td{border:1px solid #ddd;padding:4px 8px}</style>${html}`
        return frame
      }

      function renderOutput(o) {
        if (o.output_type === 'stream') return el('pre', '', text(o.text))
        if (o.output_type === 'error') {
          const tb = Array.isArray(o.traceback) ? o.traceback.join('\n') : ''
          return el('pre', 'error', stripAnsi(tb.trim() || `${o.ename}: ${o.evalue}`))
        }
        if (o.output_type !== 'display_data' && o.output_type !== 'execute_result') return null
        const data = o.data ?? {}
        for (const mime of ['image/png', 'image/jpeg', 'image/gif']) {
          if (data[mime]) {
            const img = document.createElement('img')
            img.src = `data:${mime};base64,${text(data[mime]).replace(/\s+/g, '')}`
            return img
          }
        }
        if (data['image/svg+xml']) return sandbox(text(data['image/svg+xml']))
        if (data['text/html']) return sandbox(text(data['text/html']))
        if (data['text/plain']) return el('pre', '', text(data['text/plain']))
        return null
      }

      function render(view) {
        app.textContent = ''
        app.append(el('h1', '', view.projectName))
        if (view.finishedAt) app.append(el('p', 'meta', `Run finished ${view.finishedAt}`))

        for (const notebook of view.notebooks) {
          if (view.notebooks.length > 1) app.append(el('h2', '', notebook.name))
          for (const b of notebook.blocks) {
            const block = el('div', 'block')
            // An input block has no output of its own — its value is what produced everything below.
            if (b.input) {
              block.append(el('code', 'input', `${b.input.name} = ${JSON.stringify(b.input.value)}`))
            } else if (b.content.trim()) {
              const isText = b.type === 'markdown' || b.type === 'text'
              block.append(isText ? el('div', 'md', b.content) : el('pre', 'source', b.content))
            }
            for (const o of b.outputs) {
              const node = renderOutput(o)
              if (node) block.append(node)
            }
            if (block.childNodes.length) app.append(block)
          }
        }
      }

      fetch(src)
        .then(r => (r.ok ? r.text() : Promise.reject(new Error(`HTTP ${r.status}`))))
        .then(yaml => render(DeepnoteSnapshot.parseSnapshot(yaml)))
        .catch(() => {
          // Browsers block fetch of sibling files from file://, so fall back to a picker.
          app.append(el('p', '', `Could not load ${src}. Serve this directory over HTTP, or choose the snapshot:`))
          const picker = document.createElement('input')
          picker.type = 'file'
          picker.accept = '.deepnote,.yaml,.yml'
          picker.addEventListener('change', async () => {
            const file = picker.files?.[0]
            if (file) render(DeepnoteSnapshot.parseSnapshot(await file.text()))
          })
          app.append(picker)
        })
    </script>
  </body>
</html>
