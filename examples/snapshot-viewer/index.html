<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deepnote snapshot</title>
    <style>
      body {
        margin: 0 auto;
        padding: 2rem 1rem;
        max-width: 52rem;
        font: 16px/1.5 system-ui, sans-serif;
        color: #111;
      }
      .dn-title {
        margin: 0;
        font-size: 1.5rem;
      }
      .dn-meta {
        margin: 0.25rem 0 2rem;
        color: #666;
        font-size: 0.85rem;
      }
      .dn-block {
        margin: 0 0 1.5rem;
      }
      .dn-source,
      .dn-output {
        margin: 0;
        padding: 0.75rem;
        overflow-x: auto;
        border-radius: 6px;
        font: 13px/1.5 ui-monospace, monospace;
        white-space: pre-wrap;
      }
      .dn-source {
        background: #f6f8fa;
        border: 1px solid #e6e8eb;
      }
      .dn-output {
        background: #fff;
      }
      .dn-error {
        background: #fff5f5;
        color: #b00;
      }
      .dn-image {
        max-width: 100%;
        padding: 0;
      }
      .dn-html {
        width: 100%;
        height: 18rem;
        border: 1px solid #e6e8eb;
      }
      .dn-input-value {
        display: inline-block;
        padding: 0.2rem 0.5rem;
        background: #eef4ff;
        border-radius: 4px;
        font: 13px ui-monospace, monospace;
      }
      .dn-markdown {
        white-space: pre-wrap;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0d1117;
          color: #e6edf3;
        }
        .dn-source {
          background: #161b22;
          border-color: #30363d;
        }
        .dn-output {
          background: transparent;
        }
        .dn-input-value {
          background: #1c2b47;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>

    <!-- One self-contained file: the YAML parser, the schemas, and the renderer. No server, no Python. -->
    <script src="./snapshot-viewer.js"></script>
    <script>
      // Reads ./snapshot.deepnote next to this page. Pass ?snapshot=<file> to load another one.
      const src = new URLSearchParams(location.search).get('snapshot') ?? './snapshot.deepnote'
      DeepnoteSnapshot.mountSnapshotViewer(document.getElementById('app'), { src })
    </script>
  </body>
</html>
