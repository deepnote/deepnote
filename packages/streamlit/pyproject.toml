[project]
name = "deepnote-streamlit"
version = "0.1.0"
description = "Build Streamlit apps from local Deepnote notebooks and snapshots"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
app = ["streamlit>=1.42"]
dev = ["pytest>=8.3", "ruff>=0.12", "streamlit>=1.42"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepnote_streamlit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
