name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  actions-lock:
    name: GitHub Actions lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6.1.0
      - run: gh extension install github/gh-actions-lock --pin v0.4.1 && gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}

  spell-check:
    name: Spell Check
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the spell check
        run: pnpm run spell-check
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint and format checks
        run: pnpm run lintAndFormat
  qlty:
    name: Qlty Check
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - name: Install qlty
        uses: qltysh/qlty-action/install@0814173ae3b13074fc896ca0e8e6d631c8352509

      - name: Run qlty check
        run: qlty check

      - name: Run qlty code smells analysis
        run: qlty smells
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Run typecheck
        run: pnpm run typecheck
  build:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node-version:
          &node_versions # Pinned version from .nvmrc for deterministic local/CI behavior
          - 'nvmrc'
          # Test compatibility with newer major versions
          - '22'
          - '23'
          - '24'
          - '25'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.3.0

      - name: Setup Node.js
        if: ${{ matrix.node-version == 'nvmrc' }}
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Setup Node.js
        if: ${{ matrix.node-version != 'nvmrc' }}
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm run build
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node-version: *node_versions

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.3.0

      - name: Setup Node.js
        if: ${{ matrix.node-version == 'nvmrc' }}
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Setup Node.js
        if: ${{ matrix.node-version != 'nvmrc' }}
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Run tests with coverage
        run: pnpm run test:coverage

      # Only upload coverage from the pinned version to avoid duplicate reports
      - name: Upload coverage to Codecov
        if: ${{ success() && matrix.node-version == 'nvmrc' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: true
  cli-e2e:
    name: CLI E2E
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Test CLI --version
        run: node dist/bin.js --version
        working-directory: packages/cli

      - name: Test CLI --help
        run: node dist/bin.js --help
        working-directory: packages/cli
  runtime-integration:
    name: Runtime Integration (deepnote-toolkit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.12'

      - name: Install deepnote-toolkit with its server extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install "deepnote-toolkit[server]"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      # Runs the CLI and the execution engine against the real toolkit server and kernel.
      - name: Run integration tests
        run: pnpm run test:integration
        env:
          DEEPNOTE_PYTHON: ${{ env.pythonLocation }}/bin/python
  license-check:
    name: License Check
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run license checker
        run: pnpm run license-check
  audit-prod:
    name: Audit - Production
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run audit for production dependencies
        run: pnpm audit --prod
  audit-all:
    name: Audit - All
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run audit for all dependencies
        run: pnpm audit
