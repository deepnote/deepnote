name: Viewer scope drift

# VIEWER_SCOPE in @deepnote/app-client mirrors Deepnote's hosted app viewer router. This compares it with
# the published API document weekly, and whenever the scope definition changes.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/app-client/src/viewer-scope.ts'
      - 'packages/app-client/src/hosted-scope-check.ts'
      - 'packages/app-client/scripts/check-hosted-scope.mjs'

permissions:
  contents: read

jobs:
  check:
    name: Compare VIEWER_SCOPE with api.deepnote.com
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @deepnote/app-client
        run: pnpm --filter @deepnote/app-client build

      - name: Compare with the published API document
        run: node packages/app-client/scripts/check-hosted-scope.mjs
